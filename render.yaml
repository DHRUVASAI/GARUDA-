services:
  - type: web
    name: garuda-v10-zenith
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GARUDA_REQUIRE_AUTH
        value: "true"
      - key: GARUDA_JWT_SECRET
        generateValue: true
