services:
  - type: web
    name: garuda-v4-guardian
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GARUDA_WEB3_RPC_URL
        value: "https://testnet-rpc.monad.xyz/"
      - key: GARUDA_WEB3_CHAIN_NAME
        value: "Monad Testnet"
      - key: GARUDA_WEB3_CONTRACT
        value: "0x1014300000000000000000000000000000000001"
